name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/issue-tracker/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: HIGH,CRITICAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json
      - name: push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    name: helm deploy (kind)
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - uses: azure/setup-helm@v4
      - run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n issue-tracker create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm upgrade --install tracker helm/issue-tracker \
            --set image.backend=ghcr.io/${{ needs.images.outputs.owner }}/issue-tracker/backend \
            --set image.frontend=ghcr.io/${{ needs.images.outputs.owner }}/issue-tracker/frontend \
            --set image.tag=${{ needs.images.outputs.tag }} \
            --set image.pullPolicy=IfNotPresent --set image.pullSecret=ghcr \
            --set ingress.enabled=false --set backend.hpa.enabled=false \
            --wait --timeout 5m
          kubectl -n issue-tracker get pods,svc
      - if: failure()
        run: |
          kubectl -n issue-tracker get pods -o wide
          kubectl -n issue-tracker describe pods | sed -n '/^Events/,$p'
          kubectl -n issue-tracker logs -l app.kubernetes.io/name=backend --tail=50 || true
      - name: smoke test
        run: |
          kubectl -n issue-tracker run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- sh -c '
            set -e
            curl -fs http://tracker-frontend/ready
            curl -fs -X POST http://tracker-frontend/api/issues -H "Content-Type: application/json" -d "{\"title\":\"created by ci\",\"priority\":\"high\"}"
            curl -fs http://tracker-frontend/api/issues/stats
            curl -fs http://tracker-frontend/metrics | grep tracker_issues_created_total'
