{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "it.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-backend, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-frontend, port: { number: 80 } } }
{{- end }}
