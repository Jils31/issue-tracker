apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
  namespace: {{ .Values.namespace }}
  labels: {{- include "it.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      location / { try_files $uri $uri/ /index.html; }
      location ~ ^/(api|health|ready|docs|openapi.json|metrics) {
        proxy_pass http://{{ .Release.Name }}-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Values.namespace }}
  labels: {{- include "it.labels" . | nindent 4 }}
    {{- include "it.component" "frontend" | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "it.component" "frontend" | nindent 6 }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "it.component" "frontend" | nindent 8 }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/nginx: {{ printf "%s-%s" .Release.Name .Chart.Version | sha256sum | trunc 16 }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets: [{ name: {{ .Values.image.pullSecret }} }]
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.frontend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080, name: http }]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap: { name: {{ .Release.Name }}-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Values.namespace }}
  labels: {{- include "it.labels" . | nindent 4 }}
    {{- include "it.component" "frontend" | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "it.component" "frontend" | nindent 4 }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: http
      name: http
